<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nota de Remisión | Bravo & Asociados</title>

<style>
/* ===== GENERAL ===== */
body {
    font-family: "Times New Roman", serif;
    margin: 40px;
    background: #f5f5f5;
    color: #000;
}

h1, h2 {
    margin: 0;
}

/* ===== LOGIN ===== */
#login {
    max-width: 400px;
    margin: 150px auto;
    text-align: center;
}

#login input {
    padding: 10px;
    width: 100%;
    margin-bottom: 10px;
}

/* ===== HEADER ===== */
header {
    text-align: center;
    border-bottom: 3px solid #bfa046;
    padding-bottom: 20px;
    margin-bottom: 30px;
}

header img {
    width: 250px;
    height: 250px;
    object-fit: contain;
    margin-bottom: 10px;
}

header h1 {
    font-size: 28px;
    letter-spacing: 2px;
}

/* ===== FORM ===== */
.form-section label {
    font-weight: bold;
}

.form-section input {
    width: 100%;
    padding: 6px;
    margin-bottom: 10px;
}

button {
    padding: 10px 20px;
    background: #000;
    color: #bfa046;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

/* ===== TABLE ===== */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th {
    background: #000;
    color: #bfa046;
}

th, td {
    border: 1px solid #000;
    padding: 8px;
    text-align: center;
}

/* ===== SIGNATURE ===== */
.signature {
    margin-top: 80px;
    text-align: center;
}

.signature-line {
    margin: 0 auto;
    width: 60%;
    border-top: 1px solid #000;
    margin-bottom: 5px;
}

/* ===== PRINT ===== */
@media print {
    .no-print {
        display: none;
    }
    body {
        background: #fff;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <h2>Acceso al Sistema</h2>
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>
</div>

<!-- SISTEMA -->
<div id="system" style="display:none">

<header>
    <img src="logo.png">
    <h1>BRAVO & ASOCIADOS</h1>
    <p>Nota de Remisión</p>
</header>

<div class="form-section no-print">
    <label>Cliente</label>
    <input id="cliente">

    <label>Dirección</label>
    <input id="direccion">

    <label>Producto / Servicio</label>
    <input id="producto">

    <label>Cantidad</label>
    <input type="number" id="cantidad">

    <label>Precio Unitario</label>
    <input type="number" id="precio">

    <button onclick="emitirNota()">Emitir Nota</button>
    <button onclick="exportarPDF()">Exportar PDF</button>
</div>

<hr>

<p><strong>Folio:</strong> <span id="folio"></span></p>
<p><strong>Fecha:</strong> <span id="fecha"></span></p>
<p><strong>Cliente:</strong> <span id="pCliente"></span></p>
<p><strong>Dirección:</strong> <span id="pDireccion"></span></p>

<table>
<thead>
<tr>
<th>Producto</th>
<th>Cantidad</th>
<th>Precio</th>
<th>Importe</th>
</tr>
</thead>
<tbody>
<tr>
<td id="pProducto"></td>
<td id="pCantidad"></td>
<td id="pPrecio"></td>
<td id="pImporte"></td>
</tr>
</tbody>
</table>

<h2 style="text-align:right">Total: $<span id="total"></span></h2>

<div class="signature">
    <div class="signature-line"></div>
    <p id="firmaCliente"></p>
</div>

</div>

<script>
function login() {
    if (document.getElementById("password").value === "Rojo3714") {
        document.getElementById("login").style.display = "none";
        document.getElementById("system").style.display = "block";
    } else {
        alert("Contraseña incorrecta");
    }
}

function emitirNota() {
    let cliente = clienteInput = document.getElementById("cliente").value;
    let direccion = document.getElementById("direccion").value;
    let producto = document.getElementById("producto").value;
    let cantidad = Number(document.getElementById("cantidad").value);
    let precio = Number(document.getElementById("precio").value);

    if (!cliente || !producto || cantidad <= 0 || precio <= 0) {
        alert("Completa todos los campos");
        return;
    }

    let folio = localStorage.getItem("folio") || 1;
    localStorage.setItem("folio", Number(folio) + 1);

    let total = cantidad * precio;
    let fecha = new Date().toLocaleDateString();

    document.getElementById("folio").innerText = folio;
    document.getElementById("fecha").innerText = fecha;
    document.getElementById("pCliente").innerText = cliente;
    document.getElementById("pDireccion").innerText = direccion;
    document.getElementById("pProducto").innerText = producto;
    document.getElementById("pCantidad").innerText = cantidad;
    document.getElementById("pPrecio").innerText = "$" + precio.toFixed(2);
    document.getElementById("pImporte").innerText = "$" + total.toFixed(2);
    document.getElementById("total").innerText = total.toFixed(2);

    document.getElementById("firmaCliente").innerText =
        cliente + " — " + fecha;
}

function exportarPDF() {
    window.print();
}
</script>

</body>
</html>
